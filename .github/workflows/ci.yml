name: DoePet CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run build

  flask-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r doepet_flask_mysql/requirements.txt
      - run: pytest -q doepet_flask_mysql/tests
