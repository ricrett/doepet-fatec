{% extends "base.html" %}

{% block title %}Cadastro de Clínica / Hospital Veterinário - DoePet{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-6 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 shadow-xl space-y-6">
    <div class="text-center space-y-2">
        <span class="text-3xl">🏥</span>
        <h1 class="text-2xl font-bold">Cadastro de Instituição Veterinária</h1>
        <p class="text-xs text-slate-500">Clínicas veterinárias, hospitais 24h e hemocentros veterinários</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register_institution') }}" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">CNPJ (Cadastro Único)</label>
                <input type="text" name="cnpj" required placeholder="00.000.000/0001-00"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase mb-1">CRMV do Responsável Técnico</label>
                <input type="text" name="crmv" required placeholder="CRMV-SP 12345"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Razão Social</label>
                <input type="text" name="razao_social" required placeholder="Hospital Veterinário Central LTDA"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Nome Fantasia</label>
                <input type="text" name="nome_fantasia" required placeholder="HVet Central 24h"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">E-mail Institucional</label>
                <input type="email" name="email" required placeholder="contato@hvetcentral.com.br"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Senha de Acesso</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Telefone de Emergência</label>
                <input type="text" name="telefone" required placeholder="(11) 3333-2222"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Cidade</label>
                <input type="text" name="cidade" required placeholder="São Paulo"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase mb-1">UF (Estado)</label>
                <input type="text" name="estado" maxlength="2" required placeholder="SP"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold uppercase mb-1">Endereço Completo</label>
                <input type="text" name="endereco" required placeholder="Av. Brigadeiro Luis Antonio, 1000"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Capacidade Diária (Doações)</label>
                <input type="number" name="capacidade_diaria" min="1" max="100" value="10" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <!-- Termo de Consentimento LGPD -->
        <div class="p-4 rounded-2xl bg-emerald-500/5 border border-emerald-500/20 text-xs space-y-2">
            <div class="flex items-start gap-3">
                <input type="checkbox" id="lgpd_aceite" name="lgpd_aceite" required class="mt-1 h-4 w-4 rounded text-emerald-600 focus:ring-emerald-500">
                <label for="lgpd_aceite" class="text-slate-600 dark:text-slate-300">
                    A instituição declara concordância com a <strong>Política de Privacidade DoePet e Normas do CFMV</strong> para manejo e transfusão de hemoderivados veterinários e tratamento de dados da equipe técnica.
                </label>
            </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md transition">
            Concluir Cadastro da Instituição
        </button>
    </form>
</div>
{% endblock %}
